apply plugin: 'com.android.application'

def yambApplicationId = System.getenv('YAMB_ANDROID_APPLICATION_ID') ?: 'com.yamb.balkan'
def facebookAppId = System.getenv('YAMB_ANDROID_FACEBOOK_APP_ID') ?: ''
def facebookClientToken = System.getenv('YAMB_ANDROID_FACEBOOK_CLIENT_TOKEN') ?: ''
def facebookEnabled = rootProject.ext.rgcfaIncludeFacebook
if (facebookEnabled && (!(facebookAppId ==~ /[0-9]+/) || !(facebookClientToken ==~ /[a-zA-Z0-9]+/))) {
    throw new GradleException('Set a valid Meta App ID and Android Client Token.')
}

android {
    namespace = "com.yamb.balkan"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig = true }
    
    defaultConfig {
        applicationId yambApplicationId
        buildConfigField 'boolean', 'YAMB_FACEBOOK_ENABLED', facebookEnabled.toString()
        if (facebookEnabled) {
            resValue 'string', 'facebook_app_id', facebookAppId
            resValue 'string', 'facebook_client_token', facebookClientToken
            resValue 'string', 'fb_login_protocol_scheme', "fb${facebookAppId}"
        }
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 115
        versionName "12.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Exercise the release optimizer against the isolated QA server.
        // The local debug key signs QA only; production signing is unchanged.
        qaMinified {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        // Local packaged-web QA only; normal debug and release keep server.url.
        qaLocal {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }
    if (facebookEnabled) {
        buildTypes.each { variant ->
            sourceSets.getByName(variant.name).manifest.srcFile 'src/facebook/AndroidManifest.xml'
        }
    }

    // --- AŽURIRANO: Kompatibilnost za Javu 17 ---
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // --- GDPR (User Messaging Platform) ---
    implementation("com.google.android.ump:user-messaging-platform:2.2.0")

    // --- REKLAME ---
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // --- FIREBASE INTEGRACIJA ---
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'      
}

apply from: 'capacitor.build.gradle'

// --- AKTIVACIJA PLUGINA ---
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

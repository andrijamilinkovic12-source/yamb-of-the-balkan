<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Balkan Clay Tile — dashboard icons QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      color: #edf3df;
      background: linear-gradient(180deg, rgba(18,48,27,.28), rgba(7,27,14,.66)), url("../www/assets/green-clay-balkan-diorama-v4.png") center/cover no-repeat;
    }
    main {
      position: relative;
      width: 890px;
      padding: 42px 54px 40px;
      border: 1px solid rgba(219,235,195,.28);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(83,117,72,.90), rgba(34,70,43,.94));
      box-shadow: 18px 22px 48px rgba(5,25,12,.45), -10px -10px 28px rgba(176,203,150,.10), inset 2px 2px 3px rgba(225,239,201,.20);
      text-align: center;
    }
    .eyebrow { margin: 0 0 7px; color: #e49a70; font-size: 12px; font-weight: 850; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0 0 30px; font-size: 34px; }
    .live-layout { position: relative; width: 650px; margin: 0 auto; padding-top: 46px; }
    .chat { position: absolute; left: 0; top: 0; width: 44px; height: 44px; }
    .chat img { width: 52px; height: 52px; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(7,29,15,.34)); }
    .cards { display: grid; grid-template-columns: 128px 1fr 128px; gap: 10px; }
    .card {
      min-height: 104px;
      border: 1px solid rgba(211,239,219,.35);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(98,132,86,.95), rgba(52,86,54,.94));
      box-shadow: 5px 6px 12px rgba(8,31,17,.38), -4px -4px 10px rgba(155,183,131,.13), inset 1px 1px 2px rgba(225,239,201,.30);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card img.online { width: 44px; height: 44px; }
    .card img.economy { width: 48px; height: 48px; }
    .icon-wrap { position: relative; display: grid; place-items: center; }
    .presence { position: absolute; top: 1px; right: -2px; width: 8px; height: 8px; border: 1.5px solid #f7fffc; border-radius: 50%; background: #7bdc84; box-shadow: 0 0 5px #7bdc84; }
    .number { margin-top: 3px; font-size: 19px; line-height: 1; font-weight: 900; }
    .label { margin-top: 4px; color: #c7d5ba; font-size: 9px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .league strong { font-size: 21px; letter-spacing: .08em; }
    .league::before { content: "KVARTALNA LIGA"; margin-bottom: 5px; color: #d5a174; font-size: 10px; letter-spacing: .14em; font-weight: 800; }
    .showcase { display: flex; justify-content: center; gap: 64px; margin-top: 34px; padding-top: 28px; border-top: 1px solid rgba(211,227,185,.18); }
    .showcase figure { margin: 0; }
    .showcase img { width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(7,29,15,.38)); }
    .showcase figcaption { margin-top: 8px; font-size: 13px; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Green Theme DNA</p>
    <h1>Glavni meni · nastavak paketa</h1>
    <section class="live-layout" aria-label="Prikaz u produkcijskoj veličini">
      <div class="chat"><img src="../www/assets/green-soft-clay/global-chat-free-v2.png" alt=""></div>
      <div class="cards">
        <div class="card">
          <div class="icon-wrap"><img class="online" src="../www/assets/green-soft-clay/online-players-free-v2.png" alt=""><span class="presence"></span></div>
          <span class="number">124</span><span class="label">Online</span>
        </div>
        <div class="card league"><strong>AMATER</strong></div>
        <div class="card">
          <img class="economy" src="../www/assets/green-soft-clay/ducats-undo-free-v3.png" alt="">
          <span class="number">850</span><span class="label">Dukati</span>
        </div>
      </div>
    </section>
    <section class="showcase">
      <figure><img src="../www/assets/green-soft-clay/global-chat-free-v2.png" alt=""><figcaption>Global chat</figcaption></figure>
      <figure><img src="../www/assets/green-soft-clay/online-players-free-v2.png" alt=""><figcaption>Online igrači</figcaption></figure>
      <figure><img src="../www/assets/green-soft-clay/ducats-undo-free-v3.png" alt=""><figcaption>Dukati / Ispravi upis</figcaption></figure>
    </section>
  </main>
</body>
</html>

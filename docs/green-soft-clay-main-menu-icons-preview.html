<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Balkan Clay Tile — QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #eef4e5;
      font-family: Inter, system-ui, sans-serif;
      background:
        linear-gradient(180deg, rgba(20,51,29,.30), rgba(8,29,16,.62)),
        url("../www/assets/green-clay-balkan-diorama-v4.png") center / cover no-repeat;
    }
    .panel {
      width: min(940px, calc(100vw - 64px));
      padding: 46px 48px 42px;
      border: 1px solid rgba(219,235,195,.28);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(83,117,72,.88), rgba(34,70,43,.92));
      box-shadow: 18px 22px 48px rgba(5,25,12,.45), -10px -10px 28px rgba(176,203,150,.10), inset 2px 2px 3px rgba(225,239,201,.20);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    .eyebrow { margin: 0 0 9px; color: #d7a071; font-size: 13px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 36px; letter-spacing: -.025em; text-shadow: 0 3px 10px rgba(5,25,12,.38); }
    .intro { margin: 12px auto 34px; max-width: 680px; color: #cbd9be; font-size: 15px; line-height: 1.5; }
    .icons { display: flex; justify-content: center; gap: 24px; }
    .item { width: 142px; }
    .icon-shell {
      width: 124px;
      height: 124px;
      margin: 0 auto 13px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: transparent;
      box-shadow: none;
    }
    .icon-shell img { width: 118px; height: 118px; object-fit: contain; filter: drop-shadow(0 8px 11px rgba(7,29,15,.38)); }
    .label { font-size: 13px; font-weight: 750; color: #edf3df; }
    .production-row { margin: 35px auto 0; padding-top: 28px; border-top: 1px solid rgba(211,227,185,.18); }
    .production-row p { margin: 0 0 15px; color: #bcccaf; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .mini-icons { display: flex; justify-content: center; gap: 15px; }
    .mini-icons span { width: 55px; height: 55px; position: relative; display: block; }
    .mini-icons img { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; object-fit: contain; transform: translate(-50%, -50%); filter: drop-shadow(0 5px 8px rgba(7,29,15,.34)); }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">Green Theme DNA</p>
    <h1>Balkan Clay Glyphs</h1>
    <p class="intro">Slobodni glineni simboli bez kvadratne pločice: šumsko zelena, krečnjačka ivory i terakota ostaju prepoznatljiv DNK teme.</p>
    <section class="icons" aria-label="Pet ikona glavnog menija">
      <div class="item"><div class="icon-shell"><img src="../www/assets/green-soft-clay/daily-challenge-free-v2.png" alt=""></div><div class="label">Dnevni izazov</div></div>
      <div class="item"><div class="icon-shell"><img src="../www/assets/green-soft-clay/leaderboard-free-v2.png" alt=""></div><div class="label">Top lista</div></div>
      <div class="item"><div class="icon-shell"><img src="../www/assets/green-soft-clay/statistics-free-v2.png" alt=""></div><div class="label">Statistika</div></div>
      <div class="item"><div class="icon-shell"><img src="../www/assets/green-soft-clay/settings-free-v2.png" alt=""></div><div class="label">Podešavanja</div></div>
      <div class="item"><div class="icon-shell"><img src="../www/assets/green-soft-clay/rules-free-v2.png" alt=""></div><div class="label">Pravila</div></div>
    </section>
    <section class="production-row">
      <p>Produkcijska veličina u meniju · nepromenjene klik-zone 55 × 55 px</p>
      <div class="mini-icons">
        <span><img src="../www/assets/green-soft-clay/daily-challenge-free-v2.png" alt=""></span>
        <span><img src="../www/assets/green-soft-clay/leaderboard-free-v2.png" alt=""></span>
        <span><img src="../www/assets/green-soft-clay/statistics-free-v2.png" alt=""></span>
        <span><img src="../www/assets/green-soft-clay/settings-free-v2.png" alt=""></span>
        <span><img src="../www/assets/green-soft-clay/rules-free-v2.png" alt=""></span>
      </div>
    </section>
  </main>
</body>
</html>

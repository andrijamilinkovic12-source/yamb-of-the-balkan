" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Praćenje statistike\u003c/h3>\n                \u003cp>Yamb of the Balkan čuva važne rezultate i pokazatelje napretka:\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"powerIndex\" src=\"../www/assets/theme-packs/amethyst/canonical/statistics-overview/power-index-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Indeks moći (Power Index):\u003c/strong> Glavni pokazatelj uspeha koji spaja rezultate, pobede, trofeje i ligaški učinak.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"record\" src=\"../www/assets/theme-packs/amethyst/canonical/solo-record-icons/personal-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Rekord:\u003c/strong> Vaš najbolji lični rezultat.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"wins\" src=\"../www/assets/theme-packs/amethyst/canonical/statistics-overview/wins-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Odnos pobeda/poraza (W/L):\u003c/strong> Prikazuje efikasnost u direktnim online duelima i turnirima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"fireStreak\" src=\"../www/assets/theme-packs/amethyst/canonical/statistics-overview/fire-streak-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Vatreni niz:\u003c/strong> Broj uzastopnih pobeda ostvarenih u duelima i turnirima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"allTimePoints\" src=\"../www/assets/theme-packs/amethyst/canonical/statistics-overview/all-time-points-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> All-Time PTS:\u003c/strong> Ukupan zbir poena kroz sve završene partije.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"h2h\" src=\"../www/assets/theme-packs/amethyst/canonical/statistics-overview/h2h-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Rival:\u003c/strong> Prijatelj sa kojim imate najviše odigranih međusobnih duela.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"h2h\" src=\"../www/assets/theme-packs/amethyst/canonical/statistics-overview/h2h-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Međusobni dueli (H2H)\u003c/h3>\n                \u003cp>Za svakog prijatelja-rivala formira se H2H kartica sa istorijom okršaja: pobede, porazi, nerešeno, najveća pobeda, najteži poraz, prosečni poeni i aktuelni vatreni niz protiv tog rivala.\u003c/p>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"leaderboard\" src=\"../www/assets/theme-packs/amethyst/canonical/leaderboard-room-identity/leaderboard-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Top liste i rangiranje\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>Nedeljna lista:\u003c/strong> Prikazuje najbolje rezultate iz tekuće nedelje.\u003c/li>\n                    \u003cli>\u003cstrong>Mesečna lista:\u003c/strong> Prikazuje najbolje rezultate iz tekućeg meseca.\u003c/li>\n                    \u003cli>\u003cstrong>Sva vremena:\u003c/strong> Čuva najjače rezultate od početka igre.\u003c/li>\n                    \u003cli>\u003cstrong>Lokalna lista:\u003c/strong> Privatni pregled najboljih rezultata na vašem uređaju.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"competitionsPage\" src=\"../www/assets/theme-packs/amethyst/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Multiplayer i takmičenja","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlineRandom\" src=\"../www/assets/theme-packs/amethyst/canonical/online-random-room-identity/online-random-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Multiplayer i dueli\u003c/h3>\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlineRandom\" src=\"../www/assets/theme-packs/amethyst/canonical/online-random-room-identity/online-random-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Klasični Multiplayer\u003c/h4>\n                \u003cp>Online igra vas spaja sa protivnikom koji je trenutno na mreži. Direktni dueli sa prijateljima čuvaju H2H istoriju i utiču na pobede, poraze i vatreni niz.\u003c/p>\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"inviteFriend\" src=\"../www/assets/theme-packs/amethyst/canonical/invite-friend-room-identity/invite-friend-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Privatni dueli\u003c/h4>\n                \u003cp>Prijatelja možete dodati preko liste aktivnih igrača ili pozivnice. Kada protivnik prihvati izazov, otvara se privatni duel.\u003c/p>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/amethyst/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Turniri\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/amethyst/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Sistem:\u003c/strong> Nedeljni turnir prima 8 igrača i igra se na ispadanje: četvrtfinale, polufinale i finale. Svaki duel je jedna partija.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"ducat\" src=\"../www/assets/theme-packs/amethyst/canonical/ducat/ducat-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Prijava:\u003c/strong> Kotizacija je 5500 dukata. Odjava i povraćaj mogući su samo dok traje faza prijave, pre početka turnira.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournamentStart\" src=\"../www/assets/theme-packs/amethyst/canonical/tournament-states/state-start-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Zakazivanje:\u003c/strong> Kada se prijavi svih 8 igrača, protivnici u kosturu predlažu i prihvataju termin meča. Meč se pokreće kada je termin potvrđen.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/amethyst/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Nagrade:\u003c/strong> Pobednik dobija 44.000 dukata, veliki rast Indeksa moći i \u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"hallOfFame\" src=\"../www/assets/theme-packs/amethyst/canonical/tournament-navigation/tab-hall-of-fame-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> upis u Dvoranu slavnih. Finalista koji izgubi finale dobija povraćaj uloga od 5500 dukata.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"disconnected\" src=\"../www/assets/theme-packs/amethyst/canonical/online-random-states/disconnected-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Tehnički rezultat:\u003c/strong> Napuštanje, istek vremena ili prekid veze mogu doneti tehničku pobedu protivniku.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"quarterly\" src=\"../www/assets/theme-packs/amethyst/canonical/quarterly-league-room-identity/quarterly-league-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kvartalna liga\u003c/h3>\n                \u003cp>Kvartalna liga traje 3 kalendarska meseca po vremenu Beograda. U svakoj regularno završenoj solo, AI, lokalnoj ili online partiji Vaš konačni rezultat se dodaje ligaškom zbiru. Kod tehničkog ishoda pobedniku se dodaje izračunata nagrada, a poraženom se isti obračunati iznos oduzima do najmanje 0 poena.\u003c/p>\n                \u003cp>Rangovi su: Amater 0-4.999, Profi 5.000-14.999, Majstor 15.000-49.999, Legenda 50.000-99.999 i Titan od 100.000 poena.\u003c/p>\n                \u003cp>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-asset-icon--png\" data-rules-role=\"quarterly\" src=\"../www/assets/theme-packs/amethyst/canonical/quarterly-league-room-identity/quarterly-league-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> \u003cspan class=\"rules-podium-pack rules-podium-pack-canonical rules-ql-podium-pack\" aria-hidden=\"true\">\u003cimg data-medal-tier=\"gold\" src=\"../www/assets/theme-packs/amethyst/canonical/competition-medals/quarterly-league-gold-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003cimg data-medal-tier=\"silver\" src=\"../www/assets/theme-packs/amethyst/canonical/competition-medals/quarterly-league-silver-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003cimg data-medal-tier=\"bronze\" src=\"../www/assets/theme-packs/amethyst/canonical/competition-medals/quarterly-league-bronze-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003c/span> Posle završnog obračuna kvartala prva tri igrača dobijaju 10.000, 5.000 i 2.500 dukata i medalje, a prvoplasirani postaje Šampion ciklusa. Poeni prelaze u Sva vremena, dok novi kvartal kreće od nule.\u003c/p>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"communicationPage\" src=\"../www/assets/theme-packs/amethyst/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Komunikacija","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlinePlayers\" src=\"../www/assets/theme-packs/amethyst/canonical/online-players-room-identity/online-players-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Online igrači i interakcija\u003c/h3>\n                \u003cp>Aplikacija prikazuje broj igrača koji su trenutno na mreži i listu dostupnih igrača.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"addFriend\" src=\"../www/assets/theme-packs/amethyst/canonical/online-players-internal/friend-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dodaj prijatelja:\u003c/strong> Pošaljite zahtev željenom igraču u realnom vremenu.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"spectate\" src=\"../www/assets/theme-packs/amethyst/canonical/online-players-internal/spectate-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Gledaj partiju:\u003c/strong> Posmatrajte tuđe mečeve uživo kada niste učesnik tog duela.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/amethyst/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Izazov:\u003c/strong> Klikom na ikonicu možete direktno izazvati igrača na duel.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"globalChat\" src=\"../www/assets/theme-packs/amethyst/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Chat i komunikacija\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"globalChat\" src=\"../www/assets/theme-packs/amethyst/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Globalni chat:\u003c/strong> Povezuje igrače na serveru. Zabranjeni su uvrede po rasnoj, verskoj, nacionalnoj ili polnoj osnovi, kao i vulgarnost. Kršenja pravila vode do suspenzije chata.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/amethyst/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Duel chat:\u003c/strong> Privatni chat tokom meča sa protivnikom. I ovde važe ista pravila fer i kulturnog ponašanja.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/amethyst/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Izazov iz chata:\u003c/strong> Klikom na ime igrača u globalnom chatu možete ga direktno izazvati.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"economyPage\" src=\"../www/assets/theme-packs/amethyst/canonical/ducat/ducat-front-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dukati, tokeni i Riznica","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"ducat\" src=\"../www/assets/theme-packs/amethyst/canonical/ducat/ducat-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dukati i ekonomija\u003c/h3>\n                \u003cp>Dukati su glavna valuta u igri. Koriste se za prijave na turnire, kupovine u Riznici i napredovanje kroz kolekcije.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"solo\" src=\"../www/assets/theme-packs/amethyst/canonical/solo-room-identity/solo-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Završene partije:\u003c/strong> Na kraju partije dobijate dukate u skladu sa rezultatom, a nagradu možete duplirati nagradnom reklamom.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"daily\" src=\"../www/assets/theme-packs/amethyst/canonical/daily-room-identity/daily-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dnevni izazov:\u003c/strong> Dnevna nagrada je dostupna jednom dnevno. Server određuje kockice: prve 4 se sabiraju, 5. kockica množi taj zbir, a 6. množi ceo rezultat. Nagrada se može duplirati reklamom.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"video\" src=\"../www/assets/theme-packs/amethyst/canonical/rewarded-video/rewarded-video-active-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Reklame za nagradu:\u003c/strong> U meniju dukata nagradni video donosi +500 dukata kada je dostupan i potvrđen na serveru.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/amethyst/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Takmičenja:\u003c/strong> Turniri i Kvartalna liga donose najveće nagrade najboljim igračima.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"undo\" src=\"../www/assets/theme-packs/amethyst/canonical/undo-token/undo-token-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Vraćanje upisa\u003c/h3>\n                \u003cp>Dugme za ispravku postaje aktivno posle upisa u tabelu i vraća samo poslednji upis. Posle vraćanja dugme se gasi dok ne napravite novi upis.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>Online dueli:\u003c/strong> Vraćanje upisa troši 1 token i mora se iskoristiti pre nego protivnik započne sledeći potez. Zbog toga postoji zadrška od 2.5 sekunde pre protivnikovog bacanja.\u003c/li>\n                    \u003cli>\u003cstrong>Lokalna igra:\u003c/strong> U solo i igri za dva igrača vraćanje se potvrđuje gledanjem reklame kada je dostupna na uređaju.\u003c/li>\n                    \u003cli>\u003cstrong>Nabavka tokena:\u003c/strong> U meniju dukata kartica za tokene nudi +1 token za nagradni video.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"treasury\" src=\"../www/assets/theme-packs/amethyst/canonical/../treasury-free-v3.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Riznica\u003c/h3>\n                \u003cp>Riznica je mesto za personalizaciju igre i pregled osvojenih stvari.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"trophyTab\" src=\"../www/assets/theme-packs/amethyst/canonical/treasury-controls/tab-trophies-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Trofeji:\u003c/strong> Posebni izazovi se otključavaju tokom igre i mogu doneti nagrade u dukatima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"skinsTab\" src=\"../www/assets/theme-packs/amethyst/canonical/treasury-controls/tab-skins-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kockice:\u003c/strong> Kupujete i birate skinove za kockice.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"effectsTab\" src=\"../www/assets/theme-packs/amethyst/canonical/treasury-controls/tab-effects-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Efekti:\u003c/strong> Animacije se aktiviraju kada u partiji dobijete Yamb.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"themesTab\" src=\"../www/assets/theme-packs/amethyst/canonical/treasury-controls/tab-themes-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Teme:\u003c/strong> Menjaju izgled aplikacije. Neki artikli se kupuju dukatima, a neki podržavaju reklamu ili popust od 20%.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"accountPage\" src=\"../www/assets/theme-packs/amethyst/canonical/settings-room-identity/settings-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Nalog, privatnost i server","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"profile\" src=\"../www/assets/theme-packs/amethyst/canonical/settings-controls/profile-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Google integracija i cloud čuvanje\u003c/h3>\n                \u003cp>Yamb of the Balkan koristi Google prijavu da bi se napredak vezao za vaš nalog i vratio pri promeni uređaja.\u003c/p>\n                \u003cp>Na serveru se čuvaju statistika, H2H istorija, dukati, tokeni za vraćanje upisa, trofeji, inventar Riznice, aktivna tema/skin/efekat, Dnevni izazov, Kvartalna liga i turnirski status.\u003c/p>\n\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"privacy\" src=\"../www/assets/theme-packs/amethyst/canonical/settings-controls/privacy-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Koji podaci se prikupljaju i zašto?\u003c/h4>\n                \u003cp>Prilikom prijave aplikacija koristi osnovne podatke sa Google profila:\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>Ime i prezime:\u003c/strong> Koristi se za ime u igri i prikaz na listama.\u003c/li>\n                    \u003cli>\u003cstrong>Email adresa:\u003c/strong> Služi kao jedinstveni identifikator naloga. Ne koristi se za spam poruke.\u003c/li>\n                    \u003cli>\u003cstrong>Profilna slika:\u003c/strong> Koristi se kao avatar u multiplayer mečevima.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"settings\" src=\"../www/assets/theme-packs/amethyst/canonical/settings-room-identity/settings-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Server podrška i bezbednost\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"privacy\" src=\"../www/assets/theme-packs/amethyst/canonical/settings-controls/privacy-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Fer igra:\u003c/strong> Server proverava online mečeve, rezultate, ekonomiju i nagrade kako bi sprečio manipulacije.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"timer\" src=\"../www/assets/theme-packs/amethyst/canonical/game-header/timer-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Anti-troll tajmer:\u003c/strong> Ako protivnik namerno odugovlači, server može dodeliti tehničku pobedu.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"reconnected\" src=\"../www/assets/theme-packs/amethyst/canonical/online-random-states/reconnected-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Grace period:\u003c/strong> Kod kratkog prekida veze postoji pauza od 30 sekundi za povratak u meč.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"disconnected\" src=\"../www/assets/theme-packs/amethyst/canonical/online-random-states/disconnected-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Napuštanje meča:\u003c/strong> Namerno napuštanje online duela može doneti kaznu u ligi i dukatima.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"video\" src=\"../www/assets/theme-packs/amethyst/canonical/rewarded-video/rewarded-video-active-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Reklame (AdMob)\u003c/h3>\n                \u003cp>Reklame omogućavaju da igra ostane besplatna i da se nagrade potvrde na serveru.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"timer\" src=\"../www/assets/theme-packs/amethyst/canonical/game-header/timer-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kratke reklame:\u003c/strong> Koriste se za pojedine akcije, povratak u meni, lokalno vraćanje upisa ili odjavu sa turnira. Ne isplaćuju direktno dukate ni tokene.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"video\" src=\"../www/assets/theme-packs/amethyst/canonical/rewarded-video/rewarded-video-active-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Nagradne reklame:\u003c/strong> Koriste se za dupliranje nagrade, Dnevni izazov, dukate, tokene i popust u Riznici, uz potvrdu na serveru.\u003c/li>\n                \u003c/ul>\n            "}],"easter":[{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"scoring\" src=\"../www/assets/theme-packs/easter/canonical/rules-room-identity/rules-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Pravila i bodovanje","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"scoring\" src=\"../www/assets/theme-packs/easter/canonical/rules-room-identity/rules-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Cilj igre\u003c/h3>\n                \u003cp>Cilj je osvojiti što više poena bacanjem 6 kockica i upisivanjem najboljih kombinacija u tabelu. U svakom potezu imate do 3 bacanja, a posle svakog bacanja možete zadržati kockice koje želite da sačuvate.\u003c/p>\n                \u003cp>Svako polje u tabeli može se popuniti samo jednom. Ako kombinacija ne postoji, u polje se upisuje 0.\u003c/p>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"statistics\" src=\"../www/assets/theme-packs/easter/canonical/statistics-room-identity/statistics-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kolone u igri\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>↓ NADOLE:\u003c/strong> Popunjava se redom od broja 1 do Yamba. Ne sme se preskakati.\u003c/li>\n                    \u003cli>\u003cstrong>↑ NAGORE:\u003c/strong> Popunjava se redom od Yamba do broja 1.\u003c/li>\n                    \u003cli>\u003cstrong>⇅ SREDINA:\u003c/strong> Popunjava se od sredine ka krajevima. Gornja grana kreće od MAX ka 1, a donja od MIN ka Yambu.\u003c/li>\n                    \u003cli>\u003cstrong>S SLOBODNA:\u003c/strong> Može se popunjavati bilo kojim redosledom u toku igre.\u003c/li>\n                    \u003cli>\u003cstrong>R RUČNO:\u003c/strong> Boduje se samo posle prvog bacanja. Ako pokušate da upišete polje u ovoj koloni posle drugog ili trećeg bacanja, igra ga upisuje kao 0 tek nakon potvrde.\u003c/li>\n                    \u003cli>\u003cstrong> NAJAVA:\u003c/strong> Posle prvog bacanja možete uključiti Najavu, izabrati tačno polje u koloni Najava i zatim morate upisati baš to polje. Najava se može otkazati dok još nije zaključana.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"leaderboard\" src=\"../www/assets/theme-packs/easter/canonical/leaderboard-room-identity/leaderboard-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Bodovanje i sekcije\u003c/h3>\n                \u003ch4>1. SEKCIJA (1-6)\u003c/h4>\n                \u003cp>Sabiraju se samo odgovarajući brojevi. Ako je zbir u ovoj sekciji najmanje 60, dobijate \u003cstrong>bonus od +30 poena\u003c/strong>.\u003c/p>\n                \u003ch4>2. SEKCIJA (MIN - MAX)\u003c/h4>\n                \u003cp>Računa se formulom: \u003cem>(Max - Min) * broj jedinica\u003c/em>. Ako je rezultat najmanje 60, dodaje se \u003cstrong>bonus od +40 poena\u003c/strong>. Ako je MIN 0 ili je obračun negativan, ova sekcija vredi 0.\u003c/p>\n                \u003ch4>3. SEKCIJA (KOMBINACIJE)\u003c/h4>\n                \u003cul>\n                    \u003cli>\u003cstrong>TRILING (3 iste):\u003c/strong> Vrednost tri iste kockice + 20 poena.\u003c/li>\n                    \u003cli>\u003cstrong>KENTA (5 u nizu):\u003c/strong> Niz 1-5 ili 2-6. Vredi 66 iz prvog bacanja, 56 iz drugog i 46 iz trećeg.\u003c/li>\n                    \u003cli>\u003cstrong>FUL (3 iste + 2 iste):\u003c/strong> Zbir pet kockica + 30 poena. Yamb se može upisati i kao Ful.\u003c/li>\n                    \u003cli>\u003cstrong>POKER (4 iste):\u003c/strong> Vrednost četiri iste kockice + 40 poena.\u003c/li>\n                    \u003cli>\u003cstrong>YAMB (5 istih):\u003c/strong> Vrednost pet istih kockica + 50 poena.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"statisticsPage\" src=\"../www/assets/theme-packs/easter/canonical/statistics-room-identity/statistics-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Statistika i liste","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"statistics\" src=\"../www/assets/theme-packs/easter/canonical/statistics-room-identity/statistics-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Praćenje statistike\u003c/h3>\n                \u003cp>Yamb of the Balkan čuva važne rezultate i pokazatelje napretka:\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"powerIndex\" src=\"../www/assets/theme-packs/easter/canonical/statistics-overview/power-index-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Indeks moći (Power Index):\u003c/strong> Glavni pokazatelj uspeha koji spaja rezultate, pobede, trofeje i ligaški učinak.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"record\" src=\"../www/assets/theme-packs/easter/canonical/solo-record-icons/personal-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Rekord:\u003c/strong> Vaš najbolji lični rezultat.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"wins\" src=\"../www/assets/theme-packs/easter/canonical/statistics-overview/wins-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Odnos pobeda/poraza (W/L):\u003c/strong> Prikazuje efikasnost u direktnim online duelima i turnirima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"fireStreak\" src=\"../www/assets/theme-packs/easter/canonical/statistics-overview/fire-streak-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Vatreni niz:\u003c/strong> Broj uzastopnih pobeda ostvarenih u duelima i turnirima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"allTimePoints\" src=\"../www/assets/theme-packs/easter/canonical/statistics-overview/all-time-points-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> All-Time PTS:\u003c/strong> Ukupan zbir poena kroz sve završene partije.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"h2h\" src=\"../www/assets/theme-packs/easter/canonical/statistics-overview/h2h-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Rival:\u003c/strong> Prijatelj sa kojim imate najviše odigranih međusobnih duela.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"h2h\" src=\"../www/assets/theme-packs/easter/canonical/statistics-overview/h2h-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Međusobni dueli (H2H)\u003c/h3>\n                \u003cp>Za svakog prijatelja-rivala formira se H2H kartica sa istorijom okršaja: pobede, porazi, nerešeno, najveća pobeda, najteži poraz, prosečni poeni i aktuelni vatreni niz protiv tog rivala.\u003c/p>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"leaderboard\" src=\"../www/assets/theme-packs/easter/canonical/leaderboard-room-identity/leaderboard-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Top liste i rangiranje\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>Nedeljna lista:\u003c/strong> Prikazuje najbolje rezultate iz tekuće nedelje.\u003c/li>\n                    \u003cli>\u003cstrong>Mesečna lista:\u003c/strong> Prikazuje najbolje rezultate iz tekućeg meseca.\u003c/li>\n                    \u003cli>\u003cstrong>Sva vremena:\u003c/strong> Čuva najjače rezultate od početka igre.\u003c/li>\n                    \u003cli>\u003cstrong>Lokalna lista:\u003c/strong> Privatni pregled najboljih rezultata na vašem uređaju.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"competitionsPage\" src=\"../www/assets/theme-packs/easter/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Multiplayer i takmičenja","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlineRandom\" src=\"../www/assets/theme-packs/easter/canonical/online-random-room-identity/online-random-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Multiplayer i dueli\u003c/h3>\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlineRandom\" src=\"../www/assets/theme-packs/easter/canonical/online-random-room-identity/online-random-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Klasični Multiplayer\u003c/h4>\n                \u003cp>Online igra vas spaja sa protivnikom koji je trenutno na mreži. Direktni dueli sa prijateljima čuvaju H2H istoriju i utiču na pobede, poraze i vatreni niz.\u003c/p>\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"inviteFriend\" src=\"../www/assets/theme-packs/easter/canonical/invite-friend-room-identity/invite-friend-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Privatni dueli\u003c/h4>\n                \u003cp>Prijatelja možete dodati preko liste aktivnih igrača ili pozivnice. Kada protivnik prihvati izazov, otvara se privatni duel.\u003c/p>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/easter/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Turniri\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/easter/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Sistem:\u003c/strong> Nedeljni turnir prima 8 igrača i igra se na ispadanje: četvrtfinale, polufinale i finale. Svaki duel je jedna partija.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"ducat\" src=\"../www/assets/theme-packs/easter/canonical/ducat/ducat-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Prijava:\u003c/strong> Kotizacija je 5500 dukata. Odjava i povraćaj mogući su samo dok traje faza prijave, pre početka turnira.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournamentStart\" src=\"../www/assets/theme-packs/easter/canonical/tournament-states/state-start-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Zakazivanje:\u003c/strong> Kada se prijavi svih 8 igrača, protivnici u kosturu predlažu i prihvataju termin meča. Meč se pokreće kada je termin potvrđen.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/easter/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Nagrade:\u003c/strong> Pobednik dobija 44.000 dukata, veliki rast Indeksa moći i \u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"hallOfFame\" src=\"../www/assets/theme-packs/easter/canonical/tournament-navigation/tab-hall-of-fame-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> upis u Dvoranu slavnih. Finalista koji izgubi finale dobija povraćaj uloga od 5500 dukata.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"disconnected\" src=\"../www/assets/theme-packs/easter/canonical/online-random-states/disconnected-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Tehnički rezultat:\u003c/strong> Napuštanje, istek vremena ili prekid veze mogu doneti tehničku pobedu protivniku.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"quarterly\" src=\"../www/assets/theme-packs/easter/canonical/quarterly-league-room-identity/quarterly-league-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kvartalna liga\u003c/h3>\n                \u003cp>Kvartalna liga traje 3 kalendarska meseca po vremenu Beograda. U svakoj regularno završenoj solo, AI, lokalnoj ili online partiji Vaš konačni rezultat se dodaje ligaškom zbiru. Kod tehničkog ishoda pobedniku se dodaje izračunata nagrada, a poraženom se isti obračunati iznos oduzima do najmanje 0 poena.\u003c/p>\n                \u003cp>Rangovi su: Amater 0-4.999, Profi 5.000-14.999, Majstor 15.000-49.999, Legenda 50.000-99.999 i Titan od 100.000 poena.\u003c/p>\n                \u003cp>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-asset-icon--png\" data-rules-role=\"quarterly\" src=\"../www/assets/theme-packs/easter/canonical/quarterly-league-room-identity/quarterly-league-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> \u003cspan class=\"rules-podium-pack rules-podium-pack-canonical rules-ql-podium-pack\" aria-hidden=\"true\">\u003cimg data-medal-tier=\"gold\" src=\"../www/assets/theme-packs/easter/canonical/competition-medals/quarterly-league-gold-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003cimg data-medal-tier=\"silver\" src=\"../www/assets/theme-packs/easter/canonical/competition-medals/quarterly-league-silver-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003cimg data-medal-tier=\"bronze\" src=\"../www/assets/theme-packs/easter/canonical/competition-medals/quarterly-league-bronze-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003c/span> Posle završnog obračuna kvartala prva tri igrača dobijaju 10.000, 5.000 i 2.500 dukata i medalje, a prvoplasirani postaje Šampion ciklusa. Poeni prelaze u Sva vremena, dok novi kvartal kreće od nule.\u003c/p>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"communicationPage\" src=\"../www/assets/theme-packs/easter/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Komunikacija","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlinePlayers\" src=\"../www/assets/theme-packs/easter/canonical/online-players-room-identity/online-players-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Online igrači i interakcija\u003c/h3>\n                \u003cp>Aplikacija prikazuje broj igrača koji su trenutno na mreži i listu dostupnih igrača.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"addFriend\" src=\"../www/assets/theme-packs/easter/canonical/online-players-internal/friend-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dodaj prijatelja:\u003c/strong> Pošaljite zahtev željenom igraču u realnom vremenu.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"spectate\" src=\"../www/assets/theme-packs/easter/canonical/online-players-internal/spectate-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Gledaj partiju:\u003c/strong> Posmatrajte tuđe mečeve uživo kada niste učesnik tog duela.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/easter/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Izazov:\u003c/strong> Klikom na ikonicu možete direktno izazvati igrača na duel.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"globalChat\" src=\"../www/assets/theme-packs/easter/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Chat i komunikacija\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"globalChat\" src=\"../www/assets/theme-packs/easter/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Globalni chat:\u003c/strong> Povezuje igrače na serveru. Zabranjeni su uvrede po rasnoj, verskoj, nacionalnoj ili polnoj osnovi, kao i vulgarnost. Kršenja pravila vode do suspenzije chata.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/easter/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Duel chat:\u003c/strong> Privatni chat tokom meča sa protivnikom. I ovde važe ista pravila fer i kulturnog ponašanja.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/easter/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Izazov iz chata:\u003c/strong> Klikom na ime igrača u globalnom chatu možete ga direktno izazvati.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"economyPage\" src=\"../www/assets/theme-packs/easter/canonical/ducat/ducat-front-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dukati, tokeni i Riznica","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"ducat\" src=\"../www/assets/theme-packs/easter/canonical/ducat/ducat-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dukati i ekonomija\u003c/h3>\n                \u003cp>Dukati su glavna valuta u igri. Koriste se za prijave na turnire, kupovine u Riznici i napredovanje kroz kolekcije.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"solo\" src=\"../www/assets/theme-packs/easter/canonical/solo-room-identity/solo-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Završene partije:\u003c/strong> Na kraju partije dobijate dukate u skladu sa rezultatom, a nagradu možete duplirati nagradnom reklamom.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"daily\" src=\"../www/assets/theme-packs/easter/canonical/daily-room-identity/daily-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dnevni izazov:\u003c/strong> Dnevna nagrada je dostupna jednom dnevno. Server određuje kockice: prve 4 se sabiraju, 5. kockica množi taj zbir, a 6. množi ceo rezultat. Nagrada se može duplirati reklamom.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"video\" src=\"../www/assets/theme-packs/easter/canonical/rewarded-video/rewarded-video-active-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Reklame za nagradu:\u003c/strong> U meniju dukata nagradni video donosi +500 dukata kada je dostupan i potvrđen na serveru.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/easter/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Takmičenja:\u003c/strong> Turniri i Kvartalna liga donose najveće nagrade najboljim igračima.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"undo\" src=\"../www/assets/theme-packs/easter/canonical/undo-token/undo-token-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Vraćanje upisa\u003c/h3>\n                \u003cp>Dugme za ispravku postaje aktivno posle upisa u tabelu i vraća samo poslednji upis. Posle vraćanja dugme se gasi dok ne napravite novi upis.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>Online dueli:\u003c/strong> Vraćanje upisa troši 1 token i mora se iskoristiti pre nego protivnik započne sledeći potez. Zbog toga postoji zadrška od 2.5 sekunde pre protivnikovog bacanja.\u003c/li>\n                    \u003cli>\u003cstrong>Lokalna igra:\u003c/strong> U solo i igri za dva igrača vraćanje se potvrđuje gledanjem reklame kada je dostupna na uređaju.\u003c/li>\n                    \u003cli>\u003cstrong>Nabavka tokena:\u003c/strong> U meniju dukata kartica za tokene nudi +1 token za nagradni video.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"treasury\" src=\"../www/assets/theme-packs/easter/canonical/../treasury-free-v3.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Riznica\u003c/h3>\n                \u003cp>Riznica je mesto za personalizaciju igre i pregled osvojenih stvari.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"trophyTab\" src=\"../www/assets/theme-packs/easter/canonical/treasury-controls/tab-trophies-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Trofeji:\u003c/strong> Posebni izazovi se otključavaju tokom igre i mogu doneti nagrade u dukatima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"skinsTab\" src=\"../www/assets/theme-packs/easter/canonical/treasury-controls/tab-skins-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kockice:\u003c/strong> Kupujete i birate skinove za kockice.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"effectsTab\" src=\"../www/assets/theme-packs/easter/canonical/treasury-controls/tab-effects-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Efekti:\u003c/strong> Animacije se aktiviraju kada u partiji dobijete Yamb.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"themesTab\" src=\"../www/assets/theme-packs/easter/canonical/treasury-controls/tab-themes-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Teme:\u003c/strong> Menjaju izgled aplikacije. Neki artikli se kupuju dukatima, a neki podržavaju reklamu ili popust od 20%.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"accountPage\" src=\"../www/assets/theme-packs/easter/canonical/settings-room-identity/settings-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Nalog, privatnost i server","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"profile\" src=\"../www/assets/theme-packs/easter/canonical/settings-controls/profile-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Google integracija i cloud čuvanje\u003c/h3>\n                \u003cp>Yamb of the Balkan koristi Google prijavu da bi se napredak vezao za vaš nalog i vratio pri promeni uređaja.\u003c/p>\n                \u003cp>Na serveru se čuvaju statistika, H2H istorija, dukati, tokeni za vraćanje upisa, trofeji, inventar Riznice, aktivna tema/skin/efekat, Dnevni izazov, Kvartalna liga i turnirski status.\u003c/p>\n\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"privacy\" src=\"../www/assets/theme-packs/easter/canonical/settings-controls/privacy-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Koji podaci se prikupljaju i zašto?\u003c/h4>\n                \u003cp>Prilikom prijave aplikacija koristi osnovne podatke sa Google profila:\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>Ime i prezime:\u003c/strong> Koristi se za ime u igri i prikaz na listama.\u003c/li>\n                    \u003cli>\u003cstrong>Email adresa:\u003c/strong> Služi kao jedinstveni identifikator naloga. Ne koristi se za spam poruke.\u003c/li>\n                    \u003cli>\u003cstrong>Profilna slika:\u003c/strong> Koristi se kao avatar u multiplayer mečevima.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"settings\" src=\"../www/assets/theme-packs/easter/canonical/settings-room-identity/settings-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Server podrška i bezbednost\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"privacy\" src=\"../www/assets/theme-packs/easter/canonical/settings-controls/privacy-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Fer igra:\u003c/strong> Server proverava online mečeve, rezultate, ekonomiju i nagrade kako bi sprečio manipulacije.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"timer\" src=\"../www/assets/theme-packs/easter/canonical/game-header/timer-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Anti-troll tajmer:\u003c/strong> Ako protivnik namerno odugovlači, server može dodeliti tehničku pobedu.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"reconnected\" src=\"../www/assets/theme-packs/easter/canonical/online-random-states/reconnected-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Grace period:\u003c/strong> Kod kratkog prekida veze postoji pauza od 30 sekundi za povratak u meč.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"disconnected\" src=\"../www/assets/theme-packs/easter/canonical/online-random-states/disconnected-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Napuštanje meča:\u003c/strong> Namerno napuštanje online duela može doneti kaznu u ligi i dukatima.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"video\" src=\"../www/assets/theme-packs/easter/canonical/rewarded-video/rewarded-video-active-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Reklame (AdMob)\u003c/h3>\n                \u003cp>Reklame omogućavaju da igra ostane besplatna i da se nagrade potvrde na serveru.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"timer\" src=\"../www/assets/theme-packs/easter/canonical/game-header/timer-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kratke reklame:\u003c/strong> Koriste se za pojedine akcije, povratak u meni, lokalno vraćanje upisa ili odjavu sa turnira. Ne isplaćuju direktno dukate ni tokene.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"video\" src=\"../www/assets/theme-packs/easter/canonical/rewarded-video/rewarded-video-active-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Nagradne reklame:\u003c/strong> Koriste se za dupliranje nagrade, Dnevni izazov, dukate, tokene i popust u Riznici, uz potvrdu na serveru.\u003c/li>\n                \u003c/ul>\n            "}],"desert":[{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"scoring\" src=\"../www/assets/theme-packs/desert/canonical/rules-room-identity/rules-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Pravila i bodovanje","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"scoring\" src=\"../www/assets/theme-packs/desert/canonical/rules-room-identity/rules-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Cilj igre\u003c/h3>\n                \u003cp>Cilj je osvojiti što više poena bacanjem 6 kockica i upisivanjem najboljih kombinacija u tabelu. U svakom potezu imate do 3 bacanja, a posle svakog bacanja možete zadržati kockice koje želite da sačuvate.\u003c/p>\n                \u003cp>Svako polje u tabeli može se popuniti samo jednom. Ako kombinacija ne postoji, u polje se upisuje 0.\u003c/p>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"statistics\" src=\"../www/assets/theme-packs/desert/canonical/statistics-room-identity/statistics-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kolone u igri\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>↓ NADOLE:\u003c/strong> Popunjava se redom od broja 1 do Yamba. Ne sme se preskakati.\u003c/li>\n                    \u003cli>\u003cstrong>↑ NAGORE:\u003c/strong> Popunjava se redom od Yamba do broja 1.\u003c/li>\n                    \u003cli>\u003cstrong>⇅ SREDINA:\u003c/strong> Popunjava se od sredine ka krajevima. Gornja grana kreće od MAX ka 1, a donja od MIN ka Yambu.\u003c/li>\n                    \u003cli>\u003cstrong>S SLOBODNA:\u003c/strong> Može se popunjavati bilo kojim redosledom u toku igre.\u003c/li>\n                    \u003cli>\u003cstrong>R RUČNO:\u003c/strong> Boduje se samo posle prvog bacanja. Ako pokušate da upišete polje u ovoj koloni posle drugog ili trećeg bacanja, igra ga upisuje kao 0 tek nakon potvrde.\u003c/li>\n                    \u003cli>\u003cstrong> NAJAVA:\u003c/strong> Posle prvog bacanja možete uključiti Najavu, izabrati tačno polje u koloni Najava i zatim morate upisati baš to polje. Najava se može otkazati dok još nije zaključana.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"leaderboard\" src=\"../www/assets/theme-packs/desert/canonical/leaderboard-room-identity/leaderboard-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Bodovanje i sekcije\u003c/h3>\n                \u003ch4>1. SEKCIJA (1-6)\u003c/h4>\n                \u003cp>Sabiraju se samo odgovarajući brojevi. Ako je zbir u ovoj sekciji najmanje 60, dobijate \u003cstrong>bonus od +30 poena\u003c/strong>.\u003c/p>\n                \u003ch4>2. SEKCIJA (MIN - MAX)\u003c/h4>\n                \u003cp>Računa se formulom: \u003cem>(Max - Min) * broj jedinica\u003c/em>. Ako je rezultat najmanje 60, dodaje se \u003cstrong>bonus od +40 poena\u003c/strong>. Ako je MIN 0 ili je obračun negativan, ova sekcija vredi 0.\u003c/p>\n                \u003ch4>3. SEKCIJA (KOMBINACIJE)\u003c/h4>\n                \u003cul>\n                    \u003cli>\u003cstrong>TRILING (3 iste):\u003c/strong> Vrednost tri iste kockice + 20 poena.\u003c/li>\n                    \u003cli>\u003cstrong>KENTA (5 u nizu):\u003c/strong> Niz 1-5 ili 2-6. Vredi 66 iz prvog bacanja, 56 iz drugog i 46 iz trećeg.\u003c/li>\n                    \u003cli>\u003cstrong>FUL (3 iste + 2 iste):\u003c/strong> Zbir pet kockica + 30 poena. Yamb se može upisati i kao Ful.\u003c/li>\n                    \u003cli>\u003cstrong>POKER (4 iste):\u003c/strong> Vrednost četiri iste kockice + 40 poena.\u003c/li>\n                    \u003cli>\u003cstrong>YAMB (5 istih):\u003c/strong> Vrednost pet istih kockica + 50 poena.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"statisticsPage\" src=\"../www/assets/theme-packs/desert/canonical/statistics-room-identity/statistics-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Statistika i liste","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"statistics\" src=\"../www/assets/theme-packs/desert/canonical/statistics-room-identity/statistics-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Praćenje statistike\u003c/h3>\n                \u003cp>Yamb of the Balkan čuva važne rezultate i pokazatelje napretka:\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"powerIndex\" src=\"../www/assets/theme-packs/desert/canonical/statistics-overview/power-index-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Indeks moći (Power Index):\u003c/strong> Glavni pokazatelj uspeha koji spaja rezultate, pobede, trofeje i ligaški učinak.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"record\" src=\"../www/assets/theme-packs/desert/canonical/solo-record-icons/personal-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Rekord:\u003c/strong> Vaš najbolji lični rezultat.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"wins\" src=\"../www/assets/theme-packs/desert/canonical/statistics-overview/wins-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Odnos pobeda/poraza (W/L):\u003c/strong> Prikazuje efikasnost u direktnim online duelima i turnirima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"fireStreak\" src=\"../www/assets/theme-packs/desert/canonical/statistics-overview/fire-streak-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Vatreni niz:\u003c/strong> Broj uzastopnih pobeda ostvarenih u duelima i turnirima.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"allTimePoints\" src=\"../www/assets/theme-packs/desert/canonical/statistics-overview/all-time-points-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> All-Time PTS:\u003c/strong> Ukupan zbir poena kroz sve završene partije.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"h2h\" src=\"../www/assets/theme-packs/desert/canonical/statistics-overview/h2h-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Rival:\u003c/strong> Prijatelj sa kojim imate najviše odigranih međusobnih duela.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"h2h\" src=\"../www/assets/theme-packs/desert/canonical/statistics-overview/h2h-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Međusobni dueli (H2H)\u003c/h3>\n                \u003cp>Za svakog prijatelja-rivala formira se H2H kartica sa istorijom okršaja: pobede, porazi, nerešeno, najveća pobeda, najteži poraz, prosečni poeni i aktuelni vatreni niz protiv tog rivala.\u003c/p>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"leaderboard\" src=\"../www/assets/theme-packs/desert/canonical/leaderboard-room-identity/leaderboard-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Top liste i rangiranje\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>Nedeljna lista:\u003c/strong> Prikazuje najbolje rezultate iz tekuće nedelje.\u003c/li>\n                    \u003cli>\u003cstrong>Mesečna lista:\u003c/strong> Prikazuje najbolje rezultate iz tekućeg meseca.\u003c/li>\n                    \u003cli>\u003cstrong>Sva vremena:\u003c/strong> Čuva najjače rezultate od početka igre.\u003c/li>\n                    \u003cli>\u003cstrong>Lokalna lista:\u003c/strong> Privatni pregled najboljih rezultata na vašem uređaju.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"competitionsPage\" src=\"../www/assets/theme-packs/desert/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Multiplayer i takmičenja","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlineRandom\" src=\"../www/assets/theme-packs/desert/canonical/online-random-room-identity/online-random-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Multiplayer i dueli\u003c/h3>\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlineRandom\" src=\"../www/assets/theme-packs/desert/canonical/online-random-room-identity/online-random-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Klasični Multiplayer\u003c/h4>\n                \u003cp>Online igra vas spaja sa protivnikom koji je trenutno na mreži. Direktni dueli sa prijateljima čuvaju H2H istoriju i utiču na pobede, poraze i vatreni niz.\u003c/p>\n                \u003ch4>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"inviteFriend\" src=\"../www/assets/theme-packs/desert/canonical/invite-friend-room-identity/invite-friend-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Privatni dueli\u003c/h4>\n                \u003cp>Prijatelja možete dodati preko liste aktivnih igrača ili pozivnice. Kada protivnik prihvati izazov, otvara se privatni duel.\u003c/p>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/desert/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Turniri\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/desert/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Sistem:\u003c/strong> Nedeljni turnir prima 8 igrača i igra se na ispadanje: četvrtfinale, polufinale i finale. Svaki duel je jedna partija.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"ducat\" src=\"../www/assets/theme-packs/desert/canonical/ducat/ducat-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Prijava:\u003c/strong> Kotizacija je 5500 dukata. Odjava i povraćaj mogući su samo dok traje faza prijave, pre početka turnira.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournamentStart\" src=\"../www/assets/theme-packs/desert/canonical/tournament-states/state-start-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Zakazivanje:\u003c/strong> Kada se prijavi svih 8 igrača, protivnici u kosturu predlažu i prihvataju termin meča. Meč se pokreće kada je termin potvrđen.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/desert/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Nagrade:\u003c/strong> Pobednik dobija 44.000 dukata, veliki rast Indeksa moći i \u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"hallOfFame\" src=\"../www/assets/theme-packs/desert/canonical/tournament-navigation/tab-hall-of-fame-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> upis u Dvoranu slavnih. Finalista koji izgubi finale dobija povraćaj uloga od 5500 dukata.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"disconnected\" src=\"../www/assets/theme-packs/desert/canonical/online-random-states/disconnected-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Tehnički rezultat:\u003c/strong> Napuštanje, istek vremena ili prekid veze mogu doneti tehničku pobedu protivniku.\u003c/li>\n                \u003c/ul>\n                \n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"quarterly\" src=\"../www/assets/theme-packs/desert/canonical/quarterly-league-room-identity/quarterly-league-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Kvartalna liga\u003c/h3>\n                \u003cp>Kvartalna liga traje 3 kalendarska meseca po vremenu Beograda. U svakoj regularno završenoj solo, AI, lokalnoj ili online partiji Vaš konačni rezultat se dodaje ligaškom zbiru. Kod tehničkog ishoda pobedniku se dodaje izračunata nagrada, a poraženom se isti obračunati iznos oduzima do najmanje 0 poena.\u003c/p>\n                \u003cp>Rangovi su: Amater 0-4.999, Profi 5.000-14.999, Majstor 15.000-49.999, Legenda 50.000-99.999 i Titan od 100.000 poena.\u003c/p>\n                \u003cp>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-asset-icon--png\" data-rules-role=\"quarterly\" src=\"../www/assets/theme-packs/desert/canonical/quarterly-league-room-identity/quarterly-league-room-v2.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> \u003cspan class=\"rules-podium-pack rules-podium-pack-canonical rules-ql-podium-pack\" aria-hidden=\"true\">\u003cimg data-medal-tier=\"gold\" src=\"../www/assets/theme-packs/desert/canonical/competition-medals/quarterly-league-gold-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003cimg data-medal-tier=\"silver\" src=\"../www/assets/theme-packs/desert/canonical/competition-medals/quarterly-league-silver-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003cimg data-medal-tier=\"bronze\" src=\"../www/assets/theme-packs/desert/canonical/competition-medals/quarterly-league-bronze-v2.png\" loading=\"lazy\" alt=\"\" decoding=\"async\">\u003c/span> Posle završnog obračuna kvartala prva tri igrača dobijaju 10.000, 5.000 i 2.500 dukata i medalje, a prvoplasirani postaje Šampion ciklusa. Poeni prelaze u Sva vremena, dok novi kvartal kreće od nule.\u003c/p>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"communicationPage\" src=\"../www/assets/theme-packs/desert/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Komunikacija","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"onlinePlayers\" src=\"../www/assets/theme-packs/desert/canonical/online-players-room-identity/online-players-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Online igrači i interakcija\u003c/h3>\n                \u003cp>Aplikacija prikazuje broj igrača koji su trenutno na mreži i listu dostupnih igrača.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"addFriend\" src=\"../www/assets/theme-packs/desert/canonical/online-players-internal/friend-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dodaj prijatelja:\u003c/strong> Pošaljite zahtev željenom igraču u realnom vremenu.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"spectate\" src=\"../www/assets/theme-packs/desert/canonical/online-players-internal/spectate-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Gledaj partiju:\u003c/strong> Posmatrajte tuđe mečeve uživo kada niste učesnik tog duela.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/desert/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Izazov:\u003c/strong> Klikom na ikonicu možete direktno izazvati igrača na duel.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"globalChat\" src=\"../www/assets/theme-packs/desert/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Chat i komunikacija\u003c/h3>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"globalChat\" src=\"../www/assets/theme-packs/desert/canonical/global-chat-room-identity/global-chat-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Globalni chat:\u003c/strong> Povezuje igrače na serveru. Zabranjeni su uvrede po rasnoj, verskoj, nacionalnoj ili polnoj osnovi, kao i vulgarnost. Kršenja pravila vode do suspenzije chata.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/desert/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Duel chat:\u003c/strong> Privatni chat tokom meča sa protivnikom. I ovde važe ista pravila fer i kulturnog ponašanja.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"duel\" src=\"../www/assets/theme-packs/desert/canonical/online-players-internal/duel-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Izazov iz chata:\u003c/strong> Klikom na ime igrača u globalnom chatu možete ga direktno izazvati.\u003c/li>\n                \u003c/ul>\n            "},{"title":"\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon rules-page-icon-canonical\" data-rules-role=\"economyPage\" src=\"../www/assets/theme-packs/desert/canonical/ducat/ducat-front-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dukati, tokeni i Riznica","content":"\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"ducat\" src=\"../www/assets/theme-packs/desert/canonical/ducat/ducat-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dukati i ekonomija\u003c/h3>\n                \u003cp>Dukati su glavna valuta u igri. Koriste se za prijave na turnire, kupovine u Riznici i napredovanje kroz kolekcije.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"solo\" src=\"../www/assets/theme-packs/desert/canonical/solo-room-identity/solo-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Završene partije:\u003c/strong> Na kraju partije dobijate dukate u skladu sa rezultatom, a nagradu možete duplirati nagradnom reklamom.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"daily\" src=\"../www/assets/theme-packs/desert/canonical/daily-room-identity/daily-room-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Dnevni izazov:\u003c/strong> Dnevna nagrada je dostupna jednom dnevno. Server određuje kockice: prve 4 se sabiraju, 5. kockica množi taj zbir, a 6. množi ceo rezultat. Nagrada se može duplirati reklamom.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"video\" src=\"../www/assets/theme-packs/desert/canonical/rewarded-video/rewarded-video-active-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Reklame za nagradu:\u003c/strong> U meniju dukata nagradni video donosi +500 dukata kada je dostupan i potvrđen na serveru.\u003c/li>\n                    \u003cli>\u003cstrong>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"tournament\" src=\"../www/assets/theme-packs/desert/canonical/tournament-awards/champion-trophy-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Takmičenja:\u003c/strong> Turniri i Kvartalna liga donose najveće nagrade najboljim igračima.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"undo\" src=\"../www/assets/theme-packs/desert/canonical/undo-token/undo-token-inline-v1.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\" decoding=\"async\"> Vraćanje upisa\u003c/h3>\n                \u003cp>Dugme za ispravku postaje aktivno posle upisa u tabelu i vraća samo poslednji upis. Posle vraćanja dugme se gasi dok ne napravite novi upis.\u003c/p>\n                \u003cul>\n                    \u003cli>\u003cstrong>Online dueli:\u003c/strong> Vraćanje upisa troši 1 token i mora se iskoristiti pre nego protivnik započne sledeći potez. Zbog toga postoji zadrška od 2.5 sekunde pre protivnikovog bacanja.\u003c/li>\n                    \u003cli>\u003cstrong>Lokalna igra:\u003c/strong> U solo i igri za dva igrača vraćanje se potvrđuje gledanjem reklame kada je dostupna na uređaju.\u003c/li>\n                    \u003cli>\u003cstrong>Nabavka tokena:\u003c/strong> U meniju dukata kartica za tokene nudi +1 token za nagradni video.\u003c/li>\n                \u003c/ul>\n\n                \u003ch3>\u003cimg class=\"rules-inline-icon rules-asset-icon rules-canonical-icon\" data-rules-role=\"treasury\" src=\"../www/assets/theme-packs/desert/canonical/../treasury-free-v3.png\" loading=\"lazy\" alt=\"\" aria-hidden=\"true\"

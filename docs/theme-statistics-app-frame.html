        <script>
            function goToStatsPage(index) {
                const carousel = document.getElementById('stats-carousel');
                if (!carousel) return;
                const pageCount = carousel.querySelectorAll('.stats-page').length;
                const targetIndex = Math.max(0, Math.min(index, pageCount - 1));
                const reduceMotion = document.documentElement.dataset.splashTheme === 'dark'
                    && window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
                carousel.scrollTo({ left: carousel.clientWidth * targetIndex, behavior: reduceMotion ? 'auto' : 'smooth' });
            }
            function updateStatsPagination() {
                const carousel = document.getElementById('stats-carousel');
                if(!carousel) return;
                const scrollLeft = carousel.scrollLeft;
                const width = carousel.clientWidth;
                const activeIndex = width > 0 ? Math.max(0, Math.min(1, Math.round(scrollLeft / width))) : 0;
                
                document.getElementById('stat-dot-0').classList.remove('active');
                document.getElementById('stat-dot-1').classList.remove('active');
                document.getElementById('stat-dot-0').removeAttribute('aria-current');
                document.getElementById('stat-dot-1').removeAttribute('aria-current');

                const activeDot = document.getElementById('stat-dot-' + activeIndex);
                if(activeDot) {
                    activeDot.classList.add('active');
                    activeDot.setAttribute('aria-current', 'step');
                }
            }
        </script>

<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riznica i dukati — pregled svih tema</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111923; color: #edf3f5; }
  body { margin: 0 auto; max-width: 1120px; padding: 28px 18px 64px; }
  h1 { margin: 0 0 8px; font-size: clamp(1.45rem, 3vw, 2rem); }
  p { color: #aebdc8; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin-top: 24px; }
  .card { border: 1px solid #344353; border-radius: 18px; background: #1b2835; padding: 16px; }
  .card h2 { font-size: 1.04rem; margin: 0 0 4px; }
  .card small { color: #aebdc8; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  figure { margin: 0; border-radius: 13px; background: #101b25; min-height: 154px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  img { display: block; width: 100%; max-width: 170px; aspect-ratio: 1; object-fit: contain; }
  figcaption { color: #d7e2e8; font-size: .77rem; text-align: center; }
  .aligned { color: #a9eadf; }
  .corrected { color: #c9dfff; }
</style>
</head>
<body>
  <h1>Riznica i kanonski dukat</h1>
  <p>Svaka kartica poredi aktivni kovčeg u glavnom meniju sa trenutno aktivnim kanonskim dukatom iste teme. Dukati u kovčegu su deo zasebnog PNG rendera, a ne učitana ista datoteka. Vaskršnja, Pustinjsko Staklo i Severna Maglina imaju nove kovčege usklađene sa v2 dukatom.</p>
  <div class="grid" id="themes"></div>
  <script>
    const themes = [
      ['dark', 'Zelena', 1, false], ['light', 'Svetlo Zlato', 1, false],
      ['medium', 'Trula Višnja', 1, false], ['winter', 'Plavi Okean', 1, false],
      ['neon', 'Neon Cyber', 1, false], ['amethyst', 'Kraljevski Ametist', 1, false],
      ['easter', 'Vaskršnja', 2, true], ['desert', 'Pustinjsko Staklo', 2, true],
      ['moon', 'Mesečev Sjaj', 1, false], ['severna', 'Severna Maglina', 2, true]
    ];
    const grid = document.getElementById('themes');
    for (const [id, name, version, corrected] of themes) {
      const root = id === 'dark' ? '../www/assets/green-soft-clay' : `../www/assets/theme-packs/${id}`;
      const chest = `${root}/runtime/menu/treasury-free-v3.png?v=${id === 'dark' ? 1 : corrected ? 3 : 2}`;
      const coin = `${root}/canonical/ducat/ducat-front-v${version}.png`;
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<h2>${name}</h2><small class="${corrected ? 'corrected' : 'aligned'}">${corrected ? 'Novi kovčeg usklađen sa v2 dukatom' : 'Motiv usklađen; zaseban render'}</small>
        <div class="pair"><figure><img src="${chest}" alt="Kovčeg Riznice — ${name}"><figcaption>Riznica</figcaption></figure>
        <figure><img src="${coin}" alt="Kanonski dukat — ${name}"><figcaption>Kanonski dukat</figcaption></figure></div>`;
      grid.append(card);
    }
  </script>
</body>
</html>

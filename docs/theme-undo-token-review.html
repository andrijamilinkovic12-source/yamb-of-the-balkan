<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokeni za vraćanje upisa · 9 tema</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 28px; background: #141a23; color: #eef2f5; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 42px); }
    p { margin: 0 0 26px; color: #bbc7d1; max-width: 72ch; line-height: 1.5; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
    article { border: 1px solid #3a4653; border-radius: 18px; padding: 17px; background: #202a35; }
    h2 { margin: 0; font-size: 19px; }
    small { color: #aebdca; }
    img { display: block; width: 100%; max-height: 255px; aspect-ratio: 1; object-fit: contain; background: #303a44; border-radius: 12px; margin: 12px 0; }
    .meta { color: #d8e1e8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Tokeni za vraćanje upisa</h1>
  <p>Devet različitih originalnih oblika. Svaki sledi stil 3D Soft Neomorphism i pravac svoje teme, sa jednom jasno čitljivom strelicom. PNG veličine su 512 × 512 za glavni prikaz i 192 × 192 za mali prikaz.</p>
  <main id="packs"></main>
  <script>
    const themes = [
      ['light', 'Svetlo Zlato', 'Mat silikon / meka plastika'],
      ['medium', 'Trula Višnja', 'Clay'],
      ['winter', 'Plavi Okean', 'Mat silikon / meka plastika'],
      ['neon', 'Neon Cyber', 'Mat silikon / meka plastika'],
      ['amethyst', 'Kraljevski Ametist', 'Clay'],
      ['easter', 'Vaskršnja', 'Mat silikon / meka plastika'],
      ['desert', 'Pustinjsko Staklo', 'Clay'],
      ['moon', 'Mesečev Sjaj', 'Clay'],
      ['severna', 'Severna Maglina', 'Mat silikon / meka plastika']
    ];
    document.querySelector('#packs').innerHTML = themes.map(([id, name, direction]) => `
      <article><h2>${name}</h2><small>${direction}</small>
      <img src="../www/assets/theme-packs/${id}/canonical/undo-token/undo-token-front-v1.png" alt="Token za vraćanje upisa: ${name}">
      <div class="meta">${id} · jedinstven oblik · dve PNG veličine</div></article>`).join('');
  </script>
</body>
</html>

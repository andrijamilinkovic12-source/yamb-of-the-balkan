<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="YotB Quarterly League">
  <defs>
    <linearGradient id="ql-gold" x1="18" y1="8" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4bd"/>
      <stop offset=".34" stop-color="#d2a24f"/>
      <stop offset=".72" stop-color="#75501a"/>
      <stop offset="1" stop-color="#f1d17a"/>
    </linearGradient>
    <linearGradient id="ql-gold-soft" x1="28" y1="20" x2="100" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset=".5" stop-color="#c79638"/>
      <stop offset="1" stop-color="#5c3812"/>
    </linearGradient>
    <linearGradient id="ql-burgundy" x1="22" y1="18" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d1e27"/>
      <stop offset=".52" stop-color="#21070b"/>
      <stop offset="1" stop-color="#080203"/>
    </linearGradient>
    <linearGradient id="ql-banner" x1="15" y1="48" x2="113" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#110806"/>
      <stop offset=".5" stop-color="#5b171d"/>
      <stop offset="1" stop-color="#160806"/>
    </linearGradient>
    <linearGradient id="ql-word" x1="30" y1="48" x2="98" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d1"/>
      <stop offset=".42" stop-color="#ecc861"/>
      <stop offset="1" stop-color="#a96d22"/>
    </linearGradient>
    <linearGradient id="ql-platinum" x1="28" y1="18" x2="102" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0"/>

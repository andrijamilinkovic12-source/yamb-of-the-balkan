      <stop offset="1" stop-color="#6c675f"/>
    </linearGradient>
    <filter id="ql-shadow" x="-22%" y="-22%" width="144%" height="144%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity=".56"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#d2a24f" flood-opacity=".3"/>
    </filter>
    <filter id="ql-text-shadow" x="-20%" y="-32%" width="140%" height="164%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#000000" flood-opacity=".78"/>
    </filter>
  </defs>

  <g filter="url(#ql-shadow)">
    <path d="M21 26C36 16 92 16 107 26V95C92 106 36 106 21 95Z" fill="#070403" opacity=".96"/>
    <path d="M23 27C38 18 90 18 105 27V94C90 104 38 104 23 94Z" fill="url(#ql-burgundy)" stroke="url(#ql-gold)" stroke-width="4"/>
    <path d="M31 35C44 29 84 29 97 35V87C84 94 44 94 31 87Z" fill="none" stroke="url(#ql-platinum)" stroke-width="1.4" opacity=".64"/>

    <path d="M33 43H95" stroke="url(#ql-gold)" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
    <path d="M39 100H89" stroke="url(#ql-gold)" stroke-width="2.3" stroke-linecap="round" opacity=".82"/>
    <path d="M47 106H81" stroke="url(#ql-platinum)" stroke-width="1.4" stroke-linecap="round" opacity=".56"/>

    <path d="M16 56C35 47 93 47 112 56V76C93 67 35 67 16 76Z" fill="url(#ql-banner)" stroke="url(#ql-gold)" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M16 56 27 65 16 76Z" fill="#120706" stroke="url(#ql-gold)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M112 56 101 65 112 76Z" fill="#120706" stroke="url(#ql-gold)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M24 58C43 52 85 52 104 58" fill="none" stroke="#fff6d0" stroke-width="1" stroke-linecap="round" opacity=".16"/>

    <text x="64" y="74" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="34" font-weight="700" letter-spacing="0"
          fill="url(#ql-word)" stroke="#120904" stroke-width="1.1"
          paint-order="stroke" filter="url(#ql-text-shadow)">YotB</text>

    <text x="64" y="95" text-anchor="middle"
          font-family="Montserrat, Arial, sans-serif"
          font-size="17" font-weight="900" letter-spacing="0"
          fill="url(#ql-word)" stroke="#120904" stroke-width=".7"
          paint-order="stroke" filter="url(#ql-text-shadow)">QL</text>

    <path d="M44 83H84" stroke="url(#ql-gold-soft)" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
    <path d="M52 88H76" stroke="url(#ql-platinum)" stroke-width="1.1" stroke-linecap="round" opacity=".48"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Online igrači">
  <defs>
    <linearGradient id="online-base" x1="18" y1="14" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70E0D1"/>
      <stop offset=".52" stop-color="#38B4BE"/>
      <stop offset="1" stop-color="#237A9D"/>
    </linearGradient>
    <linearGradient id="online-relief" x1="24" y1="24" x2="71" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFFF"/>
      <stop offset=".48" stop-color="#C8F5F0"/>
      <stop offset="1" stop-color="#8DDAD8"/>
    </linearGradient>
    <filter id="online-shadow" x="-35%" y="-35%" width="180%" height="180%">
      <feDropShadow dx="2.2" dy="3.2" stdDeviation="2.5" flood-color="#174F69" flood-opacity=".38"/>
    </filter>
    <filter id="online-inner-shadow" x="-35%" y="-35%" width="180%" height="180%">
      <feDropShadow dx="1.4" dy="2" stdDeviation="1.2" flood-color="#17677A" flood-opacity=".36"/>
    </filter>

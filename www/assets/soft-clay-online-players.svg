    <path d="M23 34c8-15 30-22 47-10" fill="none" stroke="#C7FFF8" stroke-width="5" stroke-linecap="round" opacity=".72"/>
    <path d="M27 71c14 10 34 8 45-5" fill="none" stroke="#155D7D" stroke-width="4" stroke-linecap="round" opacity=".28"/>
    <circle cx="31" cy="48" r="10" fill="url(#online-relief)" stroke="#ECFFFC" stroke-width="2" filter="url(#online-inner-shadow)"/>
    <path d="M47 34c10 7 10 21 0 28" fill="none" stroke="url(#online-relief)" stroke-width="9" stroke-linecap="round" filter="url(#online-inner-shadow)"/>
    <path d="M58 23c19 13 19 37 0 50" fill="none" stroke="url(#online-relief)" stroke-width="9" stroke-linecap="round" filter="url(#online-inner-shadow)"/>
    <circle cx="27.5" cy="44" r="3.1" fill="#FFFFFF" opacity=".82"/>
    <path d="M45 29c5-3 12-5 17-4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".52"/>

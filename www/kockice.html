<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Riznica - Kockice</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.5">
    <script src="languages.js?v=4.0"></script>
</head>
<body>
    <div id="ad-overlay">
        <div class="ad-content">
            <div class="ad-timer-badge">
                <span data-lang="ad_remaining">Preostalo:</span> <span id="ad-countdown">5</span>s
            </div>
            <button id="ad-close" class="ad-close-btn">✕</button>
            <div class="ad-spinner"></div>
            <div class="ad-text" data-lang="ad_loading">UČITAVANJE...</div>
            <p style="color:#aaa; font-size:0.8rem;" data-lang="ad_sub_text">(Simulacija AdMob Reward Videa)</p>
        </div>
    </div>
    
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" data-lang="modal_title_buy">POTVRDA KUPOVINE</div>
            <div id="confirm-msg" class="modal-msg">...</div>
            <div class="modal-btn-group">
                <button class="modal-btn btn-modal-cancel" onclick="closeConfirmModal()" data-lang="modal_btn_cancel">ODUSTANI</button>
                <button id="btn-confirm-buy" class="modal-btn btn-modal-confirm" data-lang="btn_buy">KUPI</button>
            </div>
        </div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    <div class="header">
        <div class="balance-group">
            <div class="balance-display"><span id="balance">0</span> <span data-lang="balance">dukata</span></div>
            <button class="btn-add-coins" onclick="shop.watchAdForCoins()">+500 🎬</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn" onclick="window.location.href='riznica.html'" data-lang="tab_trophies">TROFEJI 🏆</button>
        <button class="tab-btn active" data-lang="tab_dice">KOCKICE 🎲</button>
        <button class="tab-btn" onclick="window.location.href='efekti.html'" data-lang="tab_effects">EFEKTI ✨</button>
    </div>

    <div id="shop-container" class="content-area"></div>

    <script src="config.js?v=4.0"></script>
    <script src="managers.js?v=4.0"></script>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('yamb_theme') || 'dark';
            if (savedTheme !== 'dark') document.body.classList.add(savedTheme + '-theme');

            // Pokretanje prevoda odmah po učitavanju
            if(typeof applyTranslations === 'function') applyTranslations();
        })();

        const shop = new ShopManager({
            type: 'skin',
            items: SHOP_DATA.SKINS, 
            containerId: 'shop-container',
            balanceId: 'balance'
        });

        // --- SMART PRE-LOAD ---
        // Čim korisnik uđe u prodavnicu Kockica, učitavamo reklamu
        setTimeout(() => {
            if(shop.getAdController()) shop.getAdController().prepareReward();
        }, 1000);
        // ----------------------

        function watchAdDiscount(id) {
            const loadingText = typeof t === 'function' ? t('msg_discount_loading') : "POPUST SE UČITAVA...";
            document.querySelector('.ad-text').innerText = loadingText;

            simulateAd(() => {
                shop.applyDiscount(id);
                setTimeout(() => {
                    const defaultText = typeof t === 'function' ? t('ad_loading') : "UČITAVANJE...";
                    const adTextEl = document.querySelector('.ad-text');
                    if(adTextEl) adTextEl.innerText = defaultText;
                }, 500);
            });
        }

        window.closeConfirmModal = function() {
            document.getElementById('confirm-modal').style.display = 'none';
        }

        window.openConfirmModal = function(id, name, price) {
            const modal = document.getElementById('confirm-modal');
            const msg = document.getElementById('confirm-msg');
            const title = document.querySelector('.modal-title');
            const btnBuy = document.getElementById('btn-confirm-buy');
            const btnCancel = document.querySelector('.btn-modal-cancel');
            
            if (typeof t === 'function') {
                title.innerText = t('modal_title_buy');
                btnBuy.innerText = t('btn_buy');
                msg.innerHTML = `${t('msg_confirm_buy')} <b>${name}</b>?`;
            } else {
                msg.innerHTML = `Želite li kupiti <b>${name}</b>?`;
            }
            
            title.innerText = t('modal_title_buy');
            btnCancel.style.display = 'inline-block';
            btnBuy.innerText = t('btn_buy');
            
            const newBtn = btnBuy.cloneNode(true);
            btnBuy.parentNode.replaceChild(newBtn, btnBuy);
            
            newBtn.onclick = () => {
                shop.processTransaction(id, price);
                closeConfirmModal();
            };
            modal.style.display = 'flex';
        }

        window.showNotification = function(titleText, message, icon, type) {
            const modal = document.getElementById('confirm-modal');
            const msg = document.getElementById('confirm-msg');
            const title = document.querySelector('.modal-title');
            const btnBuy = document.getElementById('btn-confirm-buy');
            const btnCancel = document.querySelector('.btn-modal-cancel');

            title.innerText = titleText || (typeof t === 'function' ? t('modal_title_info') : "OBAVEŠTENJE");
            msg.innerHTML = message;
            btnCancel.style.display = 'none';
            btnBuy.innerText = (typeof t === 'function' ? t('modal_btn_ok') : "U REDU");

            const newBtn = btnBuy.cloneNode(true);
            btnBuy.parentNode.replaceChild(newBtn, btnBuy);
            newBtn.onclick = () => { closeConfirmModal(); };
            modal.style.display = 'flex';
        }

        window.simulateAd = function(callback) {
            const overlay = document.getElementById('ad-overlay');
            const counter = document.getElementById('ad-countdown');
            const closeBtn = document.getElementById('ad-close');
            let timeLeft = 5; 
            if(counter) counter.innerText = timeLeft;
            overlay.style.display = 'flex';
            closeBtn.style.display = 'none';
            const interval = setInterval(() => {
                timeLeft--;
                if(counter) counter.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    closeBtn.style.display = 'flex'; 
                }
            }, 1000);
            closeBtn.onclick = () => {
                overlay.style.display = 'none';
                if(callback) callback();
            };
        }
    </script>
</body>
</html>

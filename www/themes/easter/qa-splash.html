<!doctype html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Vaskr Splash QA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=5.6">
    <link rel="stylesheet" href="/teme.css?v=2.6">
    <link rel="stylesheet" href="/kockice.css?v=1.0">
</head>
<body class="easter-theme">
    <div id="splash-screen" class="screen active">
        <div class="logo-anim">
            YAMB OF THE <br> <span style="color:var(--gold-main)">BALKAN</span>
        </div>

        <div id="splash-login-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; animation: fadeIn 1s forwards;">
            <img src="/Logo_green.png" alt="Yamb Logo" style="width: 180px; height: auto; margin-bottom: 20px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));">

            <div class="splash-copy-panel">
                <p class="splash-quote-text">"Ko misli da je srećan, on je zaista srećan."</p>
                <p class="splash-quote-author">– Jovan Dučić</p>
            </div>

            <div style="width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-main), transparent); margin-bottom: 5px;"></div>

            <p style="color: var(--text-main); font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.4;">
                <span>DOBRODOŠLI</span><br>
                YAMB OF THE <span style="color: var(--gold-main);">BALKAN</span>
            </p>

            <button id="dugmeGooglePrijava" class="btn-menu" style="background: white; color: #333; font-weight: 800; font-size: 1rem; padding: 15px 30px; border-radius: 30px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 12px; width: auto; transition: transform 0.2s; margin-top: 5px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c10.035,0,18.361-7.443,19.684-17.202l-.072-.021C43.834,24.526,44,22.316,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-.792,2.237-2.231,4.166-4.087,5.571c.001-.001.002-.001.003-.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                <span>PRIJAVI SE</span>
            </button>

            <div class="splash-legal-copy">
                <span>Prihvatam </span>
                <span class="splash-legal-link">Uslove korišćenja</span> <span>i</span>
                <span class="splash-legal-link">Politiku privatnosti</span>.
            </div>
        </div>
    </div>
</body>
</html>

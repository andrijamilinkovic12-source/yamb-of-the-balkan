<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zelena Soft Clay — QA</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../teme.css">
  <link rel="stylesheet" href="../../kockice.css">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; height: auto; overflow: auto; margin: 0; padding: 24px 14px 42px; font-family: Montserrat, Arial, sans-serif; }
    .qa-shell { position: relative; z-index: 2; width: min(100%, 430px); margin: 0 auto; display: grid; gap: 16px; }
    .qa-label { margin: 0 4px -8px; color: #e5f4e9; font-size: .68rem; font-weight: 1000; letter-spacing: 1.3px; text-transform: uppercase; text-shadow: 0 2px 5px rgba(11,42,29,.55); }
    .qa-panel { padding: 15px; border-radius: 22px; background: var(--green-clay-surface-soft); border: 1px solid rgba(210,238,218,.42); box-shadow: var(--green-clay-raised); }
    .qa-panel h1, .qa-panel h2 { margin: 0 0 12px; color: var(--green-clay-ink-strong); text-shadow: 0 1px rgba(230,249,235,.55); }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mode-btn { min-height: 94px; display: grid; place-items: center; padding: 12px; border-radius: 18px; font-weight: 900; text-align: center; }
    .mode-icon { display: block; margin-bottom: 7px; font-size: 1.8rem; }
    .player-table { width: 100%; }
    .player-name { color: var(--green-clay-ink-strong); font-weight: 1000; }
    .grid-container { font-size: .69rem; }
    .grid-cell { height: clamp(20px, 3.2vh, 36px); padding: 0; }
    .row-header { font-size: .55rem; }
    .dice-container { display: flex; justify-content: center; gap: 12px; margin: 13px 0; padding: 14px 8px; border-radius: 999px; }
    .dice { position: relative; width: 55px; height: 55px; flex: 0 0 55px; border-radius: 16px; }
    .dice-dots-wrapper { position: absolute; inset: 10px; }
    .qa-actions { display: flex; justify-content: center; gap: 10px; }
    .qa-actions button { min-height: 43px; padding: 0 22px; border-radius: 999px; font-weight: 950; }
    .qa-note { margin: 0; color: #e2f2e7; font-size: .64rem; font-weight: 700; line-height: 1.45; text-align: center; text-shadow: 0 2px 5px rgba(11,42,29,.62); }
  </style>
</head>
<body>
  <main class="qa-shell">
    <p class="qa-label">Zelena Soft Clay · glavni meni</p>
    <section class="qa-panel">
      <h1>YAMB OF THE BALKAN</h1>
      <div class="mode-grid">
        <button class="mode-btn mode-solo"><span><span class="mode-icon">●</span>SOLO IGRA</span></button>
        <button class="mode-btn"><span><span class="mode-icon">● ●</span>DVA IGRAČA</span></button>
        <button class="mode-btn"><span><span class="mode-icon">◎</span>PROTIVNIK</span></button>
        <button class="mode-btn"><span><span class="mode-icon">∞</span>PRIJATELJ</span></button>
      </div>
    </section>

    <p class="qa-label">Tabla i namenski Žadna Glina skin</p>
    <section class="qa-panel">
      <div class="player-table">
        <div class="player-name">IGRAČ</div>
        <div class="grid-container" id="green-board-preview-grid"></div>
        <div class="total-score">UKUPNO · 846</div>
      </div>
      <div class="dice-container">
        <div class="dice skin-green_clay"><div class="dice-dots-wrapper val-5"><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div></div></div>
        <div class="dice skin-green_clay held"><div class="dice-dots-wrapper val-3"><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div></div></div>
        <div class="dice skin-green_clay"><div class="dice-dots-wrapper val-6"><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div><div class="dice-dot"></div></div></div>
      </div>
      <div class="qa-actions"><button class="btn-secondary">NAJAVA</button><button class="btn-throw">BACAJ</button></div>
    </section>
    <p class="qa-note">Statičan QA prikaz ne menja nalog, rezultate ni sačuvanu temu igrača.</p>
  </main>
  <script>
    (() => {
      const grid = document.getElementById('green-board-preview-grid');
      const columns = [
        ['↓', 'c-nadole'], ['SL', 'c-slobodna'], ['S', 'c-sredina'],
        ['↑', 'c-nagore'], ['R', 'c-rucno'], ['N', 'c-najava']
      ];
      const rows = ['1', '2', '3', '4', '5', '6', 'ZBIR 1', 'MAX', 'MIN', 'ZBIR 2', 'TRILING', 'KENTA', 'FUL', 'POKER', 'YAMB', 'ZBIR 3'];
      const filled = new Map([
        ['1-0', '3'], ['2-1', '8'], ['4-2', '16'], ['5-3', '25'],
        ['MAX-0', '28'], ['MIN-1', '9'], ['TRILING-2', '36'],
        ['KENTA-0', '66'], ['FUL-3', '48'], ['POKER-4', '74'], ['YAMB-5', '88']
      ]);
      const sums = [67, 82, 91, 74, 86, 79];

      const addCell = (className, text) => {
        const cell = document.createElement('div');
        cell.className = className;
        cell.textContent = text;
        grid.appendChild(cell);
      };

      addCell('grid-cell col-header', 'POLJE');
      columns.forEach(([label, cls]) => addCell(`grid-cell col-header ${cls}`, label));
      rows.forEach((row) => {
        const isSum = row.startsWith('ZBIR');
        addCell(`grid-cell row-header${isSum ? ' sum' : ''}`, row);
        columns.forEach((_, columnIndex) => {
          if (isSum) {
            addCell('grid-cell cell-sum', String(sums[columnIndex]));
            return;
          }
          const value = filled.get(`${row}-${columnIndex}`) || '';
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          const button = document.createElement('button');
          button.className = `score-btn${value ? ' filled' : ''}`;
          button.textContent = value;
          cell.appendChild(button);
          grid.appendChild(cell);
        });
      });
    })();
  </script>
</body>
</html>
